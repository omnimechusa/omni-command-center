<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omni Command Center</title>
<meta name="theme-color" content="#04260f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Command">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<header id="top">
  <div class="brand"><span class="dot"></span><b>OMNI</b> COMMAND</div>
  <div class="topright"><span id="seatbadge" class="seatbadge" onclick="OMNI.go('command','seats')"></span><span id="stamp"></span><button id="refresh" aria-label="Refresh">⟳</button></div>
</header>
<nav id="sub"></nav>
<main id="view"><div class="loading">Loading…</div></main>
<nav id="tabs">
  <button data-tab="command"><i>◎</i>Command</button>
  <button data-tab="construction"><i>⚒</i>Construction</button>
  <button data-tab="sales"><i>✎</i>Sales</button>
  <button data-tab="finance"><i>$</i>Finance</button>
  <button data-tab="marketing"><i>✦</i>Marketing</button>
</nav>
<div id="sheet" hidden><div class="sheetbox"><button class="close" id="sheetclose">✕</button><div id="sheetbody"></div></div></div>
<script src="config.js?v=6"></script>
<script src="lib/msal-browser.min.js"></script>
<script src="app.js?v=6"></script>
</body>
</html>
